name: Windows and macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }} (${{ matrix.configuration }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            runner: windows-2022
          - name: macOS ARM64
            runner: macos-latest
            architecture: arm64
          - name: macOS Intel x64
            runner: macos-15-intel
            architecture: x86_64
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_OSX_ARCHITECTURES=${{ matrix.platform.architecture }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
