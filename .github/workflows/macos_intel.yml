name: macos_intel

on:
  workflow_dispatch:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  macos-intel:
    name: macOS Intel Release
    if: github.event_name == 'workflow_dispatch' || github.event.created == true
    runs-on: macos-15-intel
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure macOS Intel
        run: >-
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package application bundle
        run: |
          test -x build/SndhArchivePlayer.app/Contents/MacOS/SndhArchivePlayer
          ditto -c -k --sequesterRsrc --keepParent build/SndhArchivePlayer.app SndhPlayer-macOS-intel.zip
          unzip -l SndhPlayer-macOS-intel.zip

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: SndhPlayer-macOS-intel.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" SndhPlayer-macOS-intel.zip --clobber
          else
            gh release create "$RELEASE_TAG" SndhPlayer-macOS-intel.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
